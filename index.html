<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KML Route Video Maker</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --text: #e6edf3; --muted: #8b949e;
    --accent: #ffb23e; --rec: #f85149; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { display: flex; overflow: hidden; }
  aside { width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  .drop { display: block; border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px 12px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
  .drop input { display: none; }
  #info { margin-top: 8px; font-size: 13px; color: var(--muted); }
  #info b { color: var(--text); }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; margin: 8px 0; }
  .row label { color: var(--muted); font-size: 13px; }
  .row output { font-variant-numeric: tabular-nums; font-size: 13px; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  input[type=text], select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; }
  .field { margin: 8px 0; }
  .field > span { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--accent); }
  input[type=color] { width: 44px; height: 28px; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 2px; }
  .stop { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; margin: 4px 0; }
  .stop input[type=text] { padding: 4px 6px; }
  .stop small { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  button { background: #21262d; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  #recBtn { background: var(--rec); border-color: var(--rec); color: #fff; }
  #status { color: var(--muted); font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }
  #status.live { color: var(--rec); font-weight: 600; }
  #stageWrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 14px; }
  #stageBox { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 8px 40px #0008; background: #0b1a2a; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #map, #out { position: absolute; inset: 0; width: 100%; height: 100%; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 16px; pointer-events: none; text-align: center; padding: 20px; }
  #result { display: none; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); overflow-x: auto; flex: none; }
  #result.show { display: flex; }
  .clip { flex: none; display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px 6px 6px; }
  .clip video { height: 72px; border-radius: 5px; background: #000; }
  .clip div { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); max-width: 230px; }
  .clip b { color: var(--text); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip a { align-self: flex-start; background: var(--ok); color: #04130a; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-decoration: none; }
  .clip.saved a { background: #21262d; color: var(--text); border: 1px solid var(--line); }
</style>
</head>
<body>
<aside>
  <h1>KML Route Video Maker</h1>
  <label class="drop" id="drop">
    <input type="file" id="file" accept=".kml,.kmz">
    Drop a <b>.kml</b> or <b>.kmz</b> file here<br>or click to choose
  </label>
  <div id="info"></div>

  <h2>Video</h2>
  <div class="field"><span>Title</span><input type="text" id="title"></div>
  <div class="field"><span>Size</span>
    <select id="res">
      <option value="1920x1080">1920 × 1080 (Full HD, landscape)</option>
      <option value="1280x720">1280 × 720 (HD, landscape)</option>
      <option value="1080x1920">1080 × 1920 (vertical, Reels/TikTok)</option>
      <option value="1080x1080">1080 × 1080 (square)</option>
    </select>
  </div>
  <div class="field"><span>Frame rate</span>
    <select id="fps"><option value="30">30 fps</option><option value="60">60 fps</option></select>
  </div>
  <div class="field"><span>Map</span>
    <select id="basemap">
      <option value="satellite">Satellite (Esri)</option>
      <option value="streets">Streets (Esri)</option>
      <option value="dark">Dark (CARTO)</option>
    </select>
  </div>
  <label class="check"><input type="checkbox" id="placeLabels" checked> Place names on satellite</label>
  <div class="field"><span>Road names (English)</span>
    <select id="roadNames">
      <option value="route">Only roads on the route</option>
      <option value="all">All roads</option>
      <option value="off">Off</option>
    </select>
  </div>

  <h2>Camera &amp; motion</h2>
  <div class="row"><label for="duration">Route travel time</label><output id="durationV"></output>
    <input type="range" id="duration" min="10" max="240" step="1" value="40"></div>
  <div class="row"><label for="zClose">Zoom at stops &amp; turns</label><output id="zCloseV"></output>
    <input type="range" id="zClose" min="8" max="18" step="0.1" value="15"></div>
  <div class="row"><label for="zFar">Zoom on open stretches</label><output id="zFarV"></output>
    <input type="range" id="zFar" min="4" max="17" step="0.1" value="12"></div>
  <div class="row"><label for="slow">Slow down at stops &amp; turns</label><output id="slowV"></output>
    <input type="range" id="slow" min="0" max="90" step="5" value="65"></div>
  <div class="row"><label for="pause">Pause at each stop</label><output id="pauseV"></output>
    <input type="range" id="pause" min="0" max="5" step="0.5" value="1"></div>
  <div class="row"><label for="pitch">Camera tilt</label><output id="pitchV"></output>
    <input type="range" id="pitch" min="0" max="70" step="1" value="55"></div>
  <label class="check"><input type="checkbox" id="rotate" checked> Turn camera with the route</label>
  <label class="check"><input type="checkbox" id="intro" checked> Start and end on the full-route overview</label>

  <h2>Overlay</h2>
  <div class="field" style="display:flex;align-items:center;gap:10px"><input type="color" id="color" value="#ffb23e"><span style="margin:0">Route colour</span></div>
  <label class="check"><input type="checkbox" id="labels" checked> Stop names</label>
  <label class="check"><input type="checkbox" id="hud" checked> Title, distance and progress bar</label>

  <h2>Music</h2>
  <label class="check"><input type="checkbox" id="musicOn" checked> Add background music to the video</label>
  <div class="field"><span>Style</span>
    <select id="musicStyle">
      <option value="energetic">Energetic dance (126 BPM)</option>
      <option value="pop">Upbeat pop (112 BPM)</option>
      <option value="cinematic">Cinematic drive (100 BPM)</option>
      <option value="file">My own music file…</option>
    </select>
  </div>
  <input type="file" id="musicFile" accept="audio/*" hidden>
  <div id="musicFileName" style="display:none;color:var(--muted);font-size:12px;margin:-2px 0 6px"></div>
  <div class="row"><label for="musicVol">Volume</label><output id="musicVolV"></output>
    <input type="range" id="musicVol" min="0" max="100" step="5" value="70"></div>
  <button id="musicTry" type="button" style="padding:5px 12px;font-size:13px">▶ Listen</button>

  <h2>Stops</h2>
  <div id="stops"><span style="color:var(--muted);font-size:13px">Load a KML to see its points.</span></div>
</aside>

<main>
  <div id="toolbar">
    <button id="playBtn" disabled>▶ Preview</button>
    <button id="recBtn" disabled>● Record video</button>
    <button id="stopBtn" disabled>■ Stop</button>
    <label class="check" title="Flies the camera path once before recording so map tiles are sharp in the video">
      <input type="checkbox" id="preload" checked> Pre-load map tiles before recording</label>
    <label class="check" title="Saves each finished recording straight to your Downloads folder">
      <input type="checkbox" id="autosave" checked> Auto-save to Downloads</label>
    <span id="status">No route loaded</span>
  </div>
  <div id="stageWrap">
    <div id="stageBox">
      <div id="stage"><div id="map"></div><canvas id="out"></canvas></div>
      <div id="empty">Load a KML file to start</div>
    </div>
  </div>
  <div id="result"></div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);

// ------------------------------------------------------------------ constants
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const BASEMAPS = {
  satellite: { tiles: [ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}"], attr: "Imagery © Esri, Maxar, Earthstar Geographics" },
  streets:   { tiles: [ESRI + "World_Street_Map/MapServer/tile/{z}/{y}/{x}"], attr: "Map © Esri" },
  dark:      { tiles: ["a", "b", "c", "d"].map(s => `https://${s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png`),
               attr: "© OpenStreetMap contributors © CARTO" },
};
const ROAD_TILES = "https://tiles.openfreemap.org/planet";   // OpenStreetMap vector tiles, no key
const ROAD_ATTR = "Roads © OpenStreetMap contributors, OpenFreeMap";
const LABEL_TILES = [ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"];
const PLUSCODE = /^[23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,}/i;
const D2R = Math.PI / 180, EARTH_R = 6371008.8, EARTH_C = 40075016.686;

// ------------------------------------------------------------------ state
const state = {
  W: 1920, H: 1080,
  route: null,        // {coords, cum, length}
  stops: [],          // {name, lon, lat, s, off, on}
  docName: "",
  profile: null,
  curS: 0, bearing: 0, phase: "idle",
  arrival: null,      // {name, t}
  running: false, abort: false,
  recorder: null,
};

// ------------------------------------------------------------------ geo helpers
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function dist(a, b) {
  const dLat = (b[1] - a[1]) * D2R, dLon = (b[0] - a[0]) * D2R;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * D2R) * Math.cos(b[1] * D2R) * Math.sin(dLon / 2) ** 2;
  return 2 * EARTH_R * Math.asin(Math.min(1, Math.sqrt(h)));
}
function brg(a, b) {
  const p1 = a[1] * D2R, p2 = b[1] * D2R, dl = (b[0] - a[0]) * D2R;
  const y = Math.sin(dl) * Math.cos(p2), x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / D2R + 360) % 360;
}
const angDiff = (a, b) => ((b - a + 540) % 360) - 180;
const metersPerPixel = (z, lat) => EARTH_C * Math.cos(lat * D2R) / (512 * 2 ** z);
const mercX = lon => (lon + 180) / 360;
const mercY = lat => (1 - Math.log(Math.tan(Math.PI / 4 + lat * D2R / 2)) / Math.PI) / 2;
const unMercY = y => (2 * Math.atan(Math.exp(Math.PI * (1 - 2 * y))) - Math.PI / 2) / D2R;

function buildRoute(coords) {
  const c = [coords[0]];
  for (let i = 1; i < coords.length; i++) if (dist(c[c.length - 1], coords[i]) > 0.5) c.push(coords[i]);
  const cum = [0];
  for (let i = 1; i < c.length; i++) cum.push(cum[i - 1] + dist(c[i - 1], c[i]));
  return { coords: c, cum, length: cum[cum.length - 1] };
}
function segIndex(r, s) {
  let lo = 0, hi = r.cum.length - 2;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (r.cum[m] <= s) lo = m; else hi = m - 1; }
  return lo;
}
function pointAt(s) {
  const r = state.route; s = clamp(s, 0, r.length);
  const i = segIndex(r, s), a = r.coords[i], b = r.coords[i + 1];
  const seg = r.cum[i + 1] - r.cum[i], t = seg > 0 ? (s - r.cum[i]) / seg : 0;
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
function projectOnRoute(r, p) {
  let best = { s: 0, off: Infinity };
  const kx = Math.cos(p[1] * D2R) * 111320, ky = 110540;
  for (let i = 0; i < r.coords.length - 1; i++) {
    const a = r.coords[i], b = r.coords[i + 1];
    const ax = (a[0] - p[0]) * kx, ay = (a[1] - p[1]) * ky, bx = (b[0] - p[0]) * kx, by = (b[1] - p[1]) * ky;
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    const t = l2 > 0 ? clamp(-(ax * dx + ay * dy) / l2, 0, 1) : 0;
    const d = Math.hypot(ax + dx * t, ay + dy * t);
    if (d < best.off) best = { s: r.cum[i] + (r.cum[i + 1] - r.cum[i]) * t, off: d };
  }
  return best;
}

// ------------------------------------------------------------------ KML parsing
function parseKml(text) {
  const xml = new DOMParser().parseFromString(text, "text/xml");
  if (xml.getElementsByTagName("parsererror").length) throw new Error("This file is not valid KML.");
  const byTag = (el, t) => Array.from(el.getElementsByTagNameNS("*", t));
  const childText = (el, t) => { for (const c of el.children) if (c.localName === t) return c.textContent.trim(); return ""; };
  const toPts = arr => arr.filter(a => a.length >= 2 && isFinite(a[0]) && isFinite(a[1])).map(a => [a[0], a[1]]);
  const parseCoords = t => toPts(t.trim().split(/\s+/).map(s => s.split(",").map(Number)));
  const docEl = byTag(xml, "Document")[0] || byTag(xml, "Folder")[0];
  const out = { docName: docEl ? childText(docEl, "name") : "", lines: [], points: [] };
  for (const pm of byTag(xml, "Placemark")) {
    const name = childText(pm, "name");
    for (const ls of byTag(pm, "LineString")) {
      const c = byTag(ls, "coordinates")[0];
      const pts = c ? parseCoords(c.textContent) : [];
      if (pts.length > 1) out.lines.push({ name, pts });
    }
    for (const tr of byTag(pm, "Track")) {   // gx:Track
      const pts = toPts(byTag(tr, "coord").map(e => e.textContent.trim().split(/\s+/).map(Number)));
      if (pts.length > 1) out.lines.push({ name, pts });
    }
    for (const pt of byTag(pm, "Point")) {
      const c = byTag(pt, "coordinates")[0];
      const pts = c ? parseCoords(c.textContent) : [];
      if (pts.length) out.points.push({ name: name || "Stop", lon: pts[0][0], lat: pts[0][1] });
    }
  }
  return out;
}

async function readFile(file) {
  if (/\.kmz$/i.test(file.name)) {
    const zip = await JSZip.loadAsync(file);
    const entry = Object.values(zip.files).find(f => /\.kml$/i.test(f.name));
    if (!entry) throw new Error("No .kml file found inside the .kmz.");
    return entry.async("string");
  }
  return file.text();
}

function loadKml(text, fileName) {
  const k = parseKml(text);
  let coords;
  if (k.lines.length) {
    const lens = k.lines.map(l => buildRoute(l.pts).length);
    coords = k.lines[lens.indexOf(Math.max(...lens))].pts;
  } else if (k.points.length >= 2) {
    coords = k.points.map(p => [p.lon, p.lat]);
  } else {
    throw new Error("The KML needs a line (route) or at least two points.");
  }
  const r = buildRoute(coords);
  if (r.coords.length < 2 || r.length < 10) throw new Error("The route is too short to animate.");
  state.route = r;
  state.docName = k.docName || fileName.replace(/\.(kml|kmz)$/i, "");

  // Stops: project onto the route, merge near-duplicates (prefer a real name over a plus code).
  const stops = [];
  for (const p of k.points) {
    const pr = projectOnRoute(r, [p.lon, p.lat]);
    const st = { name: p.name, lon: p.lon, lat: p.lat, s: pr.s, off: pr.off, on: true };
    const dup = stops.find(o => dist([o.lon, o.lat], [st.lon, st.lat]) < 50);
    if (dup) { if (PLUSCODE.test(dup.name) && !PLUSCODE.test(st.name)) dup.name = st.name; continue; }
    stops.push(st);
  }
  stops.sort((a, b) => a.s - b.s);
  state.stops = stops;

  // Sensible zoom defaults for this route length and output size.
  const lat = pointAt(r.length / 2)[1];
  const zFar = clamp(Math.log2(EARTH_C * Math.cos(lat * D2R) * state.W / (512 * clamp(r.length / 4, 800, 400000))), 4, 16);
  $("zFar").value = zFar.toFixed(1);
  $("zClose").value = Math.min(zFar + 3, 17.5).toFixed(1);
  $("title").value = state.docName;
  syncSliderText();

  $("info").innerHTML = `<b>${esc(state.docName)}</b><br>Route ${(r.length / 1000).toFixed(1)} km · ${r.coords.length} points · ${stops.length} stops`;
  $("empty").style.display = "none";
  buildRouteCells();
  renderStopList();
  syncLabels();
  updateRouteSources();
  state.curS = 0; state.phase = "idle"; state.arrival = null;
  map.jumpTo(overviewCam());
  setButtons();
  setStatus("Ready — press Preview or Record");
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderStopList() {
  const box = $("stops");
  box.innerHTML = "";
  if (!state.stops.length) { box.innerHTML = '<span style="color:var(--muted);font-size:13px">No points in this KML.</span>'; return; }
  state.stops.forEach(st => {
    const row = document.createElement("div");
    row.className = "stop";
    row.title = st.off > 300 ? `${Math.round(st.off)} m from the route line` : "";
    row.innerHTML = `<input type="checkbox" ${st.on ? "checked" : ""}><input type="text"><small>${(st.s / 1000).toFixed(1)} km</small>`;
    const [cb, name] = row.querySelectorAll("input");
    name.value = st.name;
    cb.onchange = () => { st.on = cb.checked; map.triggerRepaint(); };
    name.oninput = () => { st.name = name.value; map.triggerRepaint(); };
    box.appendChild(row);
  });
}
const activeStops = () => state.stops.filter(s => s.on);

// ------------------------------------------------------------------ motion profile
// "attention" k(s) in [0,1]: high near stops, route ends and sharp turns.
// Camera zoom goes from zFar (k=0) to zClose (k=1); speed drops by `slow` as k rises.
function buildProfile() {
  const r = state.route, L = r.length;
  const N = Math.min(5000, Math.max(300, Math.ceil(L / 8)));
  const ds = L / (N - 1);
  const stops = activeStops();
  const Rk = Math.max(200, L * 0.012);
  const w = Math.max(120, L * 0.004);
  const anchors = [0, L, ...stops.map(s => s.s)];
  let k = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const s = i * ds;
    let g = 0;
    for (const a of anchors) g = Math.max(g, Math.exp(-(((s - a) / Rk) ** 2)));
    let c = 0;
    if (s - w >= 0 && s + w <= L) {
      const p0 = pointAt(s - w), p1 = pointAt(s), p2 = pointAt(s + w);
      if (dist(p0, p1) > 1 && dist(p1, p2) > 1) c = Math.min(1, Math.abs(angDiff(brg(p0, p1), brg(p1, p2))) / 90);
    }
    k[i] = Math.max(g, c * 0.85);
  }
  const rad = Math.max(1, Math.round((L * 0.012) / ds));
  for (let pass = 0; pass < 3; pass++) {   // box blur x3 ~ gaussian
    const o = new Float32Array(N);
    let acc = 0, cnt = 0;
    for (let i = -rad; i < N + rad; i++) {
      const add = i + rad, rem = i - rad - 1;
      if (add < N) { acc += k[add]; cnt++; }
      if (rem >= 0) { acc -= k[rem]; cnt--; }
      if (i >= 0 && i < N) o[i] = acc / cnt;
    }
    k = o;
  }
  let kmax = 0; for (const v of k) kmax = Math.max(kmax, v);
  if (kmax > 0) for (let i = 0; i < N; i++) k[i] /= kmax;

  const slow = +$("slow").value / 100, pause = +$("pause").value, duration = +$("duration").value;
  const pauseStops = stops.filter(s => s.s > ds && s.s < L - ds);
  const travel = Math.max(duration * 0.3, duration - pause * pauseStops.length);
  const speed = i => 1 - slow * k[i];
  let sumW = 0;
  for (let i = 1; i < N; i++) sumW += ds / ((speed(i - 1) + speed(i)) / 2);
  const scale = travel / sumW;

  const T = [0], S = [0], stopTimes = [];
  let t = 0, si = 0;
  for (let i = 1; i < N; i++) {
    const s0 = (i - 1) * ds, s1 = i * ds, dt = ds / ((speed(i - 1) + speed(i)) / 2) * scale;

    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
    env(g, t, peak, 0.002, dcy); s.connect(f); f.connect(g); g.connect(bus);
    s.start(t, Math.random() * 0.5); s.stop(t + dcy + 0.05);
  }
  const hat = (t, open) => noiseHit(t, "highpass", 8000, open ? 0.16 : 0.1, open ? 0.22 : 0.045);
  const clap = t => { for (const o of [0, 0.012, 0.024]) noiseHit(t + o, "bandpass", 1600, 0.45, 0.12, 0.8); };
  function synth(t, midi, dur, { type = "sawtooth", peak = 0.12, cut = 2800, cutEnd = 700, send = 0, detune = 0 } = {}) {
    const f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = "lowpass"; f.Q.value = 4;
    f.frequency.setValueAtTime(cut, t); f.frequency.exponentialRampToValueAtTime(cutEnd, t + dur);
    env(g, t, peak, 0.005, dur);
    for (const dt of detune ? [-detune, detune] : [0]) {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = hz(midi); o.detune.value = dt;
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
    f.connect(g); g.connect(bus);
    if (send) { const s = ac.createGain(); s.gain.value = send; g.connect(s); s.connect(delay); }
  }
  function pad(t, chord, dur) {
    for (const m of chord) {
      const f = ac.createBiquadFilter(), g = ac.createGain();
      f.type = "lowpass"; f.frequency.value = 1400;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.035, t + dur * 0.3);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      for (const dt of [-9, 9]) {
        const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = hz(m); o.detune.value = dt;
        o.connect(f); o.start(t); o.stop(t + dur + 0.05);
      }
      f.connect(g); g.connect(bus);
    }
  }

  function playStep(t) {
    const s16 = 60 / st.bpm / 4, i = step % 16, ci = bar % 4;
    const chord = st.chords[ci], intro = bar < 1, fill = bar % 8 === 7 && i >= 12;
    if (!intro && st.kick.includes(i)) kick(t);
    if (!intro && (st.clap.includes(i) || fill)) clap(t);
    if (st.hats === "16th" || i % 2 === 0) hat(t, st.openHat.includes(i));
    if (!intro && st.bassSteps.includes(i))
      synth(t, st.bass[ci], s16 * 1.6, { peak: 0.3, cut: 900, cutEnd: 200, detune: 6 });
    if ((st.arp === "16th" || i % 2 === 0) && (!intro || i % 4 === 0)) {
      const notes = [chord[0], chord[1], chord[2], chord[0] + 12];
      const n = notes[(i >> (st.arp === "16th" ? 0 : 1)) % 4] + st.arpOct;
      synth(t, n, s16 * 1.4, { type: "square", peak: 0.05, cut: 4200, cutEnd: 900, send: 0.4 });
    }
    if (st.stabs && !intro && st.stabs.includes(i))
      for (const m of chord) synth(t, m + 12, s16 * 1.2, { peak: 0.045, cut: 3500, cutEnd: 1200, send: 0.25 });
    if (st.pad && i === 0) pad(t, chord.map(m => m - 12), s16 * 16);
  }
  function schedule() {
    while (nextT < ac.currentTime + 0.15 && nextT < endT) {
      playStep(nextT);
      nextT += 60 / st.bpm / 4;
      if (++step % 16 === 0) bar++;
    }
  }

  return {
    ensure,
    get stream() { return dest?.stream; },
    async loadFile(file) {
      ensure();
      fileBuf = await ac.decodeAudioData(await file.arrayBuffer());
      return fileBuf.duration;
    },
    hasFile: () => !!fileBuf,
    // Plays for `seconds`, fading in briefly and out over the last 2.5 s.
    start(seconds) {
      this.stop(true);
      ensure();
      const t0 = ac.currentTime + 0.05, v = volume();
      endT = t0 + seconds;
      out.gain.cancelScheduledValues(0);
      out.gain.setValueAtTime(0.0001, t0);
      out.gain.exponentialRampToValueAtTime(v, t0 + 0.4);
      out.gain.setValueAtTime(v, Math.max(t0 + 0.5, endT - 2.5));
      out.gain.linearRampToValueAtTime(0.0001, endT);
      const style = $("musicStyle").value;
      if (style === "file" && fileBuf) {
        fileSrc = ac.createBufferSource(); fileSrc.buffer = fileBuf; fileSrc.loop = true;
        fileSrc.connect(bus); fileSrc.start(t0); fileSrc.stop(endT + 0.1);
        return;
      }
      st = STYLES[style] || STYLES.energetic;
      step = 0; bar = 0; nextT = t0;
      schedule();
      timer = setInterval(schedule, 25);
    },
    stop(now = false) {
      clearInterval(timer); timer = 0;
      if (!ac) return;
      const t = ac.currentTime;
      out.gain.cancelScheduledValues(t);
      out.gain.setValueAtTime(out.gain.value, t);
      out.gain.linearRampToValueAtTime(0.0001, t + (now ? 0.02 : 0.3));
      if (fileSrc) { try { fileSrc.stop(t + 0.35); } catch {} fileSrc = null; }
      endT = t;
    },
    setVolume() { if (ac && timer) out.gain.setTargetAtTime(volume(), ac.currentTime, 0.05); },
  };
})();

const musicWanted = () => $("musicOn").checked && ($("musicStyle").value !== "file" || Music.hasFile());

// ------------------------------------------------------------------ playback
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
function waitIdle(ms) {
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(to); map.off("idle", fin); res(); };
    const to = setTimeout(fin, ms);
    map.on("idle", fin);
    map.triggerRepaint();
  });
}
async function hold(sec, onTick) {
  const start = performance.now();
  while (!state.abort) {
    const now = await nextFrame();
    const t = (now - start) / 1000;
    onTick?.(t);
    map.triggerRepaint();
    if (t >= sec) break;
  }
}

async function preloadTiles() {
  const P = state.profile, n = clamp(Math.ceil(P.total), 15, 90);
  map.jumpTo(overviewCam());
  await waitIdle(4000);
  state.bearing = 0;
  for (let i = 0; i < n && !state.abort; i++) {
    const s = sAtTime(P.total * i / (n - 1));
    state.curS = s; setDone(s);
    map.jumpTo(followCam(s, 0, true));
    setStatus(`Loading map tiles ${i + 1}/${n}…`);
    await waitIdle(2500);
  }
}

async function run(record) {
  if (!state.route || state.running) return;
  state.running = true; state.abort = false; setButtons();
  const withMusic = musicWanted();
  if (withMusic) Music.ensure();   // must happen inside the click, before any await
  buildProfile();
  const P = state.profile, intro = $("intro").checked;
  const T_INTRO = intro ? 1.5 : 0.5, T_FLY = intro ? 4 : 0, T_OUT = intro ? 3.5 : 0, T_END = 2.5;
  const total = T_INTRO + T_FLY + P.total + T_OUT + T_END;
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

  try {
    if (record && $("preload").checked) await preloadTiles();
    if (state.abort) return;

    state.curS = 0; state.arrival = null; setDone(0);
    state.bearing = 0;
    const start = followCam(0, 0, true);
    map.jumpTo(intro ? overviewCam() : start);
    setStatus("Preparing…");
    await waitIdle(4000);
    if (state.abort) return;

    if (record) startRecorder(withMusic);
    if (withMusic) Music.start(total);
    const t0 = performance.now();
    const tick = () => setStatus(`${record ? "● REC " : "▶ "}${fmt((performance.now() - t0) / 1000)} / ${fmt(total)}`, record);

    await hold(T_INTRO, tick);
    if (intro && !state.abort) {
      map.flyTo({ ...start, duration: T_FLY * 1000, curve: 1.3, essential: true });
      await hold(T_FLY, tick);
    }

    // Follow the route in real time.
    const fStart = performance.now();
    let last = fStart, prevS = -1;
    while (!state.abort) {
      const now = await nextFrame();
      const t = Math.min((now - fStart) / 1000, P.total), dt = (now - last) / 1000;
      last = now;
      const s = sAtTime(t);
      for (const st of activeStops()) if (st.s > prevS && st.s <= s) state.arrival = { name: st.name, t: now };
      prevS = s; state.curS = s;
      setDone(s);
      map.jumpTo(followCam(s, dt, false));
      tick();
      if (t >= P.total) break;
    }

    if (!state.abort) {
      if (intro) map.flyTo({ ...overviewCam(), duration: T_OUT * 1000, curve: 1.3, essential: true });
      await hold(T_OUT + T_END, tick);
    }
  } finally {
    map.stop();
    Music.stop();
    const recorded = !!state.recorder;
    if (recorded) await stopRecorder();
    state.running = false;
    setButtons();
    if (!recorded) setStatus(state.abort ? "Stopped" : "Done");
  }
}

// ------------------------------------------------------------------ recording
function pickMime(audio) {
  const c = audio
    ? ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4",
       "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
    : ["video/mp4;codecs=avc1.640028", "video/mp4;codecs=avc1", "video/mp4",
       "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
function startRecorder(withMusic) {
  const fps = +$("fps").value, mime = pickMime(withMusic);
  const stream = out.captureStream(fps);
  if (withMusic && Music.stream) for (const tr of Music.stream.getAudioTracks()) stream.addTrack(tr);
  const rec = new MediaRecorder(stream, { mimeType: mime || undefined,
    videoBitsPerSecond: Math.round(state.W * state.H * fps * 0.2), audioBitsPerSecond: 192000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.done = new Promise(res => rec.onstop = () => res(new Blob(chunks, { type: rec.mimeType || mime || "video/webm" })));
  rec.start(500);
  state.recorder = rec;
}
// Every recording is kept in the list below the stage (newest first) until the page closes,
// and saved to Downloads automatically unless that option is off.
const clips = [];
async function stopRecorder() {
  const rec = state.recorder;
  state.recorder = null;
  if (rec.state !== "inactive") rec.stop();
  const blob = await rec.done;
  const ext = /mp4/.test(blob.type) ? "mp4" : "webm";
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
  const base = ($("title").value.trim() || "route").replace(/[^\w\- ]+/g, "").replace(/\s+/g, "-");
  const clip = { name: `${base}_${stamp}.${ext}`, url: URL.createObjectURL(blob), saved: false };
  clips.push(clip);

  const el = document.createElement("div");
  el.className = "clip";
  el.innerHTML = `<video controls muted preload="metadata"></video><div><b></b><span></span><a download>⬇ Download</a></div>`;
  el.querySelector("video").src = clip.url;
  el.querySelector("b").textContent = clip.name;
  el.querySelector("b").title = clip.name;
  el.querySelector("span").textContent = `${(blob.size / 1048576).toFixed(1)} MB · ${state.W}×${state.H}${state.abort ? " · partial" : ""}`;
  const a = el.querySelector("a");
  a.href = clip.url; a.download = clip.name;
  a.onclick = () => { clip.saved = true; el.classList.add("saved"); a.textContent = "✓ Saved — download again"; };
  $("result").prepend(el);
  $("result").classList.add("show");

  if ($("autosave").checked) a.click();
  setStatus(clip.saved ? `Saved ${clip.name} to Downloads` : "Video ready — download it below");
}
window.addEventListener("beforeunload", e => {
  if (state.recorder || clips.some(c => !c.saved)) { e.preventDefault(); e.returnValue = ""; }
});

// ------------------------------------------------------------------ UI wiring
function setStatus(t, live = false) { const el = $("status"); el.textContent = t; el.classList.toggle("live", live); }
function setButtons() {
  const has = !!state.route, r = state.running;
  $("playBtn").disabled = !has || r;
  $("recBtn").disabled = !has || r || !window.MediaRecorder;
  $("stopBtn").disabled = !r;
  for (const id of ["res", "fps", "file", "musicTry"]) $(id).disabled = r;
}
$("playBtn").onclick = () => run(false);
$("recBtn").onclick = () => run(true);
$("stopBtn").onclick = () => { state.abort = true; };

// Music controls
let trying = 0;
function stopTry() { clearTimeout(trying); trying = 0; $("musicTry").textContent = "▶ Listen"; }
$("musicTry").onclick = () => {
  if (state.running) return;
  if (trying) { Music.stop(); stopTry(); return; }
  if ($("musicStyle").value === "file" && !Music.hasFile()) { $("musicFile").click(); return; }
  Music.start(12);
  $("musicTry").textContent = "■ Stop";
  trying = setTimeout(stopTry, 12000);
};
$("musicStyle").addEventListener("change", () => {
  if (trying) { Music.stop(); stopTry(); }
  if ($("musicStyle").value === "file" && !Music.hasFile()) $("musicFile").click();
});
$("musicFile").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const secs = await Music.loadFile(f);
    $("musicFileName").textContent = `${f.name} · ${Math.floor(secs / 60)}:${String(Math.round(secs % 60)).padStart(2, "0")} (loops if shorter than the video)`;
    $("musicFileName").style.display = "block";
    $("musicStyle").value = "file";
  } catch { alert("Could not read that audio file. Try an MP3, M4A or WAV."); }
};
$("musicVol").addEventListener("input", () => Music.setVolume());

async function handleFile(file) {
  if (!file || state.running) return;
  try { loadKml(await readFile(file), file.name); }
  catch (e) { setStatus("Error: " + e.message); alert(e.message); }
}
$("file").onchange = e => handleFile(e.target.files[0]);
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev === "drop" || e.target === document.documentElement) drop.classList.remove("over"); }));
document.addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));

const sliders = { duration: v => v + " s", zClose: v => (+v).toFixed(1), zFar: v => (+v).toFixed(1),
                  slow: v => v + "%", pause: v => v + " s", pitch: v => v + "°", musicVol: v => v + "%" };
for (const [id, f] of Object.entries(sliders)) {
  const el = $(id), show = () => { $(id + "V").textContent = f(el.value); };
  el.addEventListener("input", () => {
    show();
    if (id === "pitch" && state.route && !state.running && state.phase === "idle") map.triggerRepaint();
  });
  show();
}
// Keep displays in sync when loadKml sets zoom values programmatically.
const syncSliderText = () => { for (const [id, f] of Object.entries(sliders)) $(id + "V").textContent = f($(id).value); };

$("res").onchange = applySize;
for (const id of ["basemap", "placeLabels", "roadNames", "color"]) $(id).addEventListener("input", syncLabels);
for (const id of ["title", "labels", "hud"]) $(id).addEventListener("input", () => map.triggerRepaint());
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state.recorder) setStatus("⚠ Keep this tab visible while recording", true);
});

map.on("load", async () => {
  syncLabels();
  updateRouteSources();
  // Optional: ?kml=path/to/file.kml auto-loads when the page is served over http(s).
  const q = new URLSearchParams(location.search).get("kml");
  if (q) {
    try { const r = await fetch(q); if (!r.ok) throw new Error(r.status); loadKml(await r.text(), q.split("/").pop()); }
    catch (e) { setStatus("Could not load " + q); }
  }
});
applySize();
setButtons();
if (!window.MediaRecorder) setStatus("This browser cannot record video — use Chrome or Edge");
</script>
</body>
</html>
